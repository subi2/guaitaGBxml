:root{--bg:#0a0c0b;--pn:#111513;--pn2:#161b18;--bd:#22302a;--bd2:#2e3f36;--tx:#d6e0d9;--dim:#7c8b83;--acc:#c6ff1a;--acc2:#9fd600;--err:#ff5b5b;--warn:#ffb020;--info:#5ab0ff;--ok:#5fe08a;
--lw:270px;--rw:300px;--bh:240px;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 var(--sans);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100%}
/* menu */
#menubar{display:flex;align-items:stretch;background:#070908;border-bottom:1px solid var(--bd);user-select:none;height:28px}
#menubar .brand{font:600 13px var(--mono);color:var(--acc);padding:0 12px;display:flex;align-items:center;letter-spacing:.02em}
#menubar .brand b{color:var(--tx);font-weight:400}
#menubar .brand .appico{width:20px;height:20px;border-radius:4px;margin-right:8px;display:block}
.mtop{position:relative;padding:0 10px;display:flex;align-items:center;cursor:default}
.mtop:hover,.mtop.open{background:var(--pn2);color:var(--acc)}
.menu{position:absolute;top:100%;left:0;min-width:240px;background:var(--pn);border:1px solid var(--bd2);box-shadow:0 8px 24px #000a;padding:4px 0;z-index:100;display:none;color:var(--tx)}
.mtop.open>.menu{display:block}
.mi{position:relative;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 26px;white-space:nowrap;cursor:default}
.mi:hover{background:var(--bd);color:var(--acc)}
.mi.dis{opacity:.4;pointer-events:none}
.mi .k{margin-left:auto;color:var(--dim);font:11px var(--mono);padding-left:20px}
.mi.chk::before{content:'✓';position:absolute;left:9px;color:var(--acc)}
.mi.sub::after{content:'▸';margin-left:auto;padding-left:16px;color:var(--dim)}
.mi .menu{top:-5px;left:100%}
.mi.sub:hover>.menu{display:block}
.msep{height:1px;background:var(--bd);margin:4px 0}
/* toolbar */
#toolbar{display:flex;gap:2px;align-items:center;padding:3px 6px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tb{background:none;border:1px solid transparent;padding:3px 8px;border-radius:3px;cursor:pointer;color:var(--tx);font-size:12px}
.tb:hover{border-color:var(--bd2);color:var(--acc)}.tb.on{background:var(--bd);color:var(--acc);border-color:var(--bd2)}
.tsep{width:1px;height:18px;background:var(--bd);margin:0 4px}
#toolbar select,.pn select,.pn input[type=text],.pn input[type=number],.pn input[type=date],.dlg input,.dlg select{background:var(--bg);border:1px solid var(--bd2);padding:2px 6px;border-radius:3px}
#toolbar label{color:var(--dim);font-size:12px;margin-left:4px}
.badge{font:11px var(--mono);padding:1px 6px;border-radius:9px;background:var(--bd)}
.badge.e{background:#4a1515;color:#ffb3b3}.badge.w{background:#4a3510;color:#ffd890}.badge.ok{background:#173a22;color:#a8f0c0}
/* main */
#main{display:grid;grid-template-columns:var(--lw) 4px minmax(0,1fr) 4px var(--rw);grid-template-rows:minmax(0,1fr) 4px var(--bh);min-height:0;min-width:0;overflow:hidden}
#main.nol{grid-template-columns:0 0 minmax(0,1fr) 4px var(--rw)}#main.nor{grid-template-columns:var(--lw) 4px minmax(0,1fr) 0 0}#main.nol.nor{grid-template-columns:0 0 minmax(0,1fr) 0 0}
#main.nob{grid-template-rows:minmax(0,1fr) 0 0}#main.nol #left,#main.nor #right{display:none}
.pn{background:var(--pn);overflow:auto;min-width:0;min-height:0}
.ph{position:sticky;top:0;z-index:2;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--pn);display:flex;align-items:center;gap:6px}
.ph input{flex:1;min-width:0}
#left{grid-row:1/4;grid-column:1}#rzl{grid-row:1/4;grid-column:2}#view{grid-row:1;grid-column:3}#rzr{grid-row:1/4;grid-column:4}#right{grid-row:1/4;grid-column:5}
#rzb{grid-row:2;grid-column:3}#bottom{grid-row:3;grid-column:3;display:flex;flex-direction:column}
.rz{background:var(--bd);cursor:col-resize}.rz:hover{background:var(--acc2)}#rzb{cursor:row-resize}
#view{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#151a17,#060807)}
#view canvas.gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);text-align:center;padding:20px}
#drop h1{font:600 26px var(--mono);color:var(--acc);margin:0}#drop .bt{background:var(--bd);border:1px solid var(--bd2);padding:6px 14px;cursor:pointer;border-radius:3px}
#drop .bt:hover{color:var(--acc)}
#view.dragover{outline:2px dashed var(--acc);outline-offset:-6px}
#view[data-bg=grey]{background:#23272E}#view[data-bg=white]{background:#f2f4f1}
#view[data-bg=white] .mv-lab{background:#fffd;color:#333;border-color:#ccc}
/* logo navegador + panell (estil guaitaQuery) */
#navCol{position:absolute;top:10px;right:10px;z-index:40;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:8px;max-height:calc(100% - 20px);pointer-events:none}
#navMain,#navPanels{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding:2px;pointer-events:none}
#navMain>*,#navPanels>*{pointer-events:auto;flex:none}
#navPanels:empty{display:none}
#navLogo{position:relative;width:48px;padding:4px;background:#0b0d10e6;border:1px solid var(--bd2);border-radius:10px;cursor:pointer;box-shadow:0 3px 12px #0005;transition:transform .12s,box-shadow .12s}
#navLogo:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px #0007;border-color:var(--acc2)}
#navLogo:disabled{opacity:.4;cursor:default}
#navLogo img{display:block;width:100%;height:auto;pointer-events:none;border-radius:6px}
#navCube{position:relative;display:none;background:var(--pn);border:1px solid var(--bd2);border-radius:11px;padding:9px;box-shadow:0 10px 30px #000a;width:164px}
#navCube.show{display:block;animation:ncpop .12s ease}
@keyframes ncpop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#navCube .nc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#navCube .nc-grid button{height:30px;border:1px solid var(--bd2);background:var(--pn2);color:var(--tx);border-radius:7px;cursor:pointer;font:12px var(--mono);display:flex;align-items:center;justify-content:center;padding:0}
#navCube .nc-grid button:hover{background:var(--acc);color:#0a0c0b;border-color:var(--acc)}
#navCube .nc-grid button.home{background:var(--acc);color:#0a0c0b;border-color:var(--acc);font-weight:600}
#navCube .nc-row{display:flex;align-items:center;gap:4px;margin-top:8px}
#navCube .nc-row span{font-size:10px;color:var(--dim);width:42px;flex-shrink:0;letter-spacing:.03em}
#navCube .nc-row button{flex:1;height:24px;border:1px solid var(--bd2);background:var(--pn2);color:var(--dim);border-radius:6px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;min-width:0}
#navCube .nc-row button:hover{color:var(--tx);border-color:var(--acc2)}
#navCube .nc-row button.bg{height:20px}
#navCube button.on{outline:1.5px solid var(--acc);color:var(--tx)}
/* ViewCube */
#vcubeWrap{position:relative;width:120px;height:120px}
#vcubeWrap[hidden]{display:none}
#vcube{width:120px;height:120px;display:block;cursor:grab;touch-action:none}
#vcHome{position:absolute;left:-2px;top:-2px;width:22px;height:22px;padding:0;border:1px solid var(--bd2);background:var(--pn);color:var(--acc);border-radius:5px;cursor:pointer;font-size:12px;line-height:1}
#vcHome:hover{background:var(--acc);color:#0a0c0b}
/* vistes múltiples */
#mvOverlay{position:absolute;inset:0;pointer-events:none;z-index:2}
.mv-cell{position:absolute;box-sizing:border-box;border:1px solid var(--bd2)}
.mv-lab{position:absolute;top:6px;left:8px;font:10.5px var(--mono);color:var(--dim);background:#0d0f12a0;padding:1px 6px;border-radius:4px;letter-spacing:.03em;border:1px solid transparent}
/* progrés */
#prog{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:60;background:var(--pn);border:1px solid var(--bd2);padding:14px 18px;min-width:300px;box-shadow:0 10px 40px #000c}
#prog[hidden]{display:none}
#prog .pt{font:12px var(--mono);color:var(--acc);margin-bottom:8px}
#prog .pb{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
#prog .pb i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
#tabbody{position:relative}
table.dt tbody tr{height:23px}table.dt tbody tr.sp{height:0}table.dt tr.sp td{padding:0;border:0;height:0}

#legend{position:absolute;left:8px;bottom:8px;background:#0c0f0dd9;border:1px solid var(--bd);padding:6px 8px;font-size:11px;max-height:60%;overflow:auto;min-width:150px}
#legend .lh{font:600 10px var(--mono);color:var(--acc);text-transform:uppercase;margin-bottom:4px}
#legend .li{display:flex;gap:6px;align-items:center;cursor:pointer;padding:1px 0}#legend .li:hover{color:var(--acc)}
#legend .sw{width:12px;height:12px;border:1px solid #0006;flex:none}
#view #axes{position:absolute;right:8px;bottom:8px;width:70px;height:70px;pointer-events:none}
#hud{position:absolute;left:8px;top:8px;font:11px var(--mono);color:var(--acc);pointer-events:none;z-index:3;text-shadow:0 1px 2px #000}
#tip{position:absolute;pointer-events:none;background:#000d;border:1px solid var(--bd2);padding:3px 6px;font-size:11px;display:none;white-space:nowrap;z-index:5}
/* tree */
.tree{font-size:12px;padding:4px 0}
.tn{display:flex;align-items:center;gap:4px;padding:2px 6px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--pn2)}.tn.sel{background:var(--bd);color:var(--acc)}
.tw{width:14px;color:var(--dim);flex:none;text-align:center}.tic{font:10px var(--mono);color:var(--acc2);flex:none;width:18px}
.tc{padding-left:14px}.tn .cnt{color:var(--dim);font-size:10px;margin-left:auto;padding-left:6px}
.tn .eye{opacity:.35;padding:0 3px}.tn .eye:hover{opacity:1}.tn.hid{opacity:.45}
/* props */
.props{padding:8px 10px;font-size:12px}
.props h3{margin:0 0 2px;font:600 14px var(--sans);color:var(--acc);word-break:break-word}
.props .kind{font:11px var(--mono);color:var(--dim);margin-bottom:8px}
.props table{width:100%;border-collapse:collapse}.props td{padding:3px 0;border-bottom:1px solid var(--bd);vertical-align:top}
.props td:first-child{color:var(--dim);width:42%;padding-right:6px}.props td:last-child{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.props select,.props input{width:100%}
.props .acts{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.btn{background:var(--bd);border:1px solid var(--bd2);padding:3px 9px;border-radius:3px;cursor:pointer;font-size:12px}
.btn:hover{color:var(--acc);border-color:var(--acc2)}.btn.pri{background:var(--acc);color:#0a0c0b;border-color:var(--acc);font-weight:600}
.props .sec{font:600 11px var(--mono);color:var(--dim);text-transform:uppercase;margin:12px 0 4px}
.lnk{color:var(--acc2);cursor:pointer;text-decoration:underline dotted}
.empty{color:var(--dim);padding:16px 10px;font-size:12px}
/* bottom tabs/tables */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--bd);background:var(--pn);overflow-x:auto;flex:none}
.tab{padding:5px 12px;cursor:pointer;color:var(--dim);border-right:1px solid var(--bd);white-space:nowrap;font-size:12px}
.tab:hover{color:var(--tx)}.tab.on{color:var(--acc);background:var(--bg);box-shadow:inset 0 2px 0 var(--acc)}
.tabbar-r{margin-left:auto;display:flex;gap:6px;align-items:center;padding:0 8px}
#tabbody{flex:1;overflow:auto;background:var(--bg);min-height:0}
table.dt{border-collapse:collapse;width:100%;font-size:12px}
table.dt th{position:sticky;top:0;background:var(--pn2);color:var(--dim);font-weight:600;text-align:left;padding:4px 8px;border-bottom:1px solid var(--bd2);cursor:pointer;white-space:nowrap;user-select:none}
table.dt th:hover{color:var(--acc)}table.dt th.n,table.dt td.n{text-align:right}
table.dt td{padding:3px 8px;border-bottom:1px solid #18201c;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.dt td.n{font-family:var(--mono);font-size:11.5px}
table.dt tr:hover td{background:#141a16}table.dt tr.sel td{background:#1e2a22;color:var(--acc)}
.sev{font:600 10px var(--mono);padding:1px 5px;border-radius:2px}.sev.error{background:#5a1a1a;color:#ffb3b3}.sev.warn{background:#5a4010;color:#ffd890}.sev.info{background:#14324f;color:#a9d4ff}
.okc{color:var(--ok)}.koc{color:var(--err)}.nac{color:var(--dim)}
.kpis{display:flex;flex-wrap:wrap;gap:8px;padding:8px}
.kpi{background:var(--pn);border:1px solid var(--bd);padding:6px 10px;min-width:120px}
.kpi .v{font:600 18px var(--mono);color:var(--acc)}.kpi .l{font-size:11px;color:var(--dim)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.adjm td,.adjm th{padding:2px 5px;font:11px var(--mono);border:1px solid #1a221e;text-align:center}
.adjm th{background:var(--pn2);color:var(--dim);font-weight:400;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* status */
#status{display:flex;gap:14px;align-items:center;padding:2px 10px;background:#070908;border-top:1px solid var(--bd);font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;height:22px}
#status .acc{color:var(--acc)}#st-msg{margin-left:auto;overflow:hidden;text-overflow:ellipsis}
/* floating panels & dialogs */
.fp{position:relative;background:var(--pn);border:1px solid var(--bd2);border-radius:8px;box-shadow:0 10px 30px #000b;width:260px;font-size:12px;padding:10px 12px}
.fp h4{margin:0 0 8px;font:600 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center}
.fp h4 .x{margin-left:auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 2px}.fp h4 .x:hover{color:var(--err)}
.fp .fb{display:grid;gap:6px}
.fp-note{margin-top:4px;padding-top:8px;border-top:1px solid var(--bd);font-size:10.5px;line-height:1.45;color:var(--dim)}
/* caixa de secció: lliscadors dobles (estil guaitaQuery) */
.sec-grid{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:stretch}
.sec-z{display:flex;flex-direction:column;align-items:center;gap:4px}
.sec-zv{font:10.5px var(--mono);color:var(--acc);white-space:nowrap}
.sec-r{display:flex;flex-direction:column;gap:2px;min-width:0}
.sec-ctl{margin:4px 0 6px}
.sec-lbl{font-size:11px;color:var(--dim);margin-bottom:5px;display:flex;align-items:center}
.sec-val{margin-left:auto;font:10.5px var(--mono);color:var(--acc)}
.sec-r select{width:100%;margin:4px 0}
.dual{position:relative;height:18px;margin:0 7px;touch-action:none;cursor:pointer}
.dual-track{position:absolute;left:0;right:0;top:7px;height:5px;background:#222831;border-radius:4px;overflow:hidden}
.dual-fill{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--acc)}
.dual-thumb{position:absolute;top:50%;width:14px;height:14px;margin-left:-7px;transform:translateY(-50%);background:var(--acc);border:2px solid #0b0d10;border-radius:50%;cursor:grab;box-shadow:0 1px 3px #0008;touch-action:none;z-index:2}
.dual-thumb:focus-visible{outline:2px solid var(--tx);outline-offset:1px}
.dual-thumb.drag{cursor:grabbing;box-shadow:0 0 0 4px #c6ff1a47}
.dual.vert{width:18px;height:170px;margin:7px 0}
.dual.vert .dual-track{top:0;bottom:0;left:7px;right:auto;width:5px;height:auto}
.dual.vert .dual-fill{left:0;right:0;top:auto;bottom:0;width:auto;height:100%}
.dual.vert .dual-thumb{top:auto;left:50%;margin-left:-7px;margin-bottom:-7px;transform:none}
.sec-tick{position:absolute;left:-16px;width:13px;height:9px;margin-bottom:-4px;cursor:pointer;z-index:1}
.sec-tick::before{content:'';position:absolute;left:0;right:0;top:3px;height:2px;background:var(--dim)}
.sec-tick:hover::before{background:var(--acc);height:3px}
.dual.vert{margin-left:16px!important}
.fp .row{display:grid;grid-template-columns:96px 1fr 44px;gap:6px;align-items:center}
.fp .row span:last-child{font:11px var(--mono);color:var(--dim);text-align:right}
.fp .row.row2{grid-template-columns:96px 1fr 72px}.fp .row.row2 input{min-width:0}
.fp input[type=range]{width:100%;accent-color:var(--acc)}
.fp label.c{display:flex;gap:6px;align-items:center}
input[type=checkbox]{accent-color:var(--acc)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:200}
.dlg{background:var(--pn);border:1px solid var(--bd2);width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #000}
.dlg .dh{padding:10px 14px;font:600 14px var(--mono);color:var(--acc);border-bottom:1px solid var(--bd)}
.dlg .db{padding:12px 16px;overflow:auto;line-height:1.55}
.dlg .db h4{color:var(--acc);margin:14px 0 4px;font:600 13px var(--sans)}
.dlg .db kbd{font:11px var(--mono);background:var(--bd);border:1px solid var(--bd2);padding:0 5px;border-radius:3px}
.dlg .db code{font:12px var(--mono);color:var(--acc2)}
.dlg .df{padding:8px 14px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:6px}
.dlg table{border-collapse:collapse}.dlg td{padding:3px 10px 3px 0;vertical-align:top}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--acc2);padding:6px 14px;z-index:300;display:none;font-size:12px}
.rose text{font:10px var(--mono);fill:var(--dim)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:760px){:root{--lw:0px;--rw:0px}#main{grid-template-columns:0 0 minmax(0,1fr) 0 0}#left,#right,#rzl,#rzr{display:none}#toolbar .opt{display:none}}
@media print{body{overflow:visible}}

 guide: '<h4>Obrir</h4>Arrossega un fitxer gbXML al visor o fes servir <b>Fitxer › Obre</b>. S\'accepten les versions 0.37, 5.x i 6/7.x de l\'esquema i unitats en metres, peus, mil·límetres, centímetres o polzades (es converteix tot a metres).<h4>Navegar</h4>Botó esquerre: òrbita · dret o central: desplaça · roda: zoom · doble clic: centra l\'element. Al mòbil: un dit òrbita, dos dits zoom i desplaçament.<h4>Navegació, ViewCube i vistes</h4>El <b>ViewCube</b> (a dalt a la dreta) mostra l\'orientació real (nord segons <code>CADModelAzimuth</code>): clic en una cara, aresta o vèrtex per anar a aquella vista, arrossega per orbitar, <kbd>⌂</kbd> torna a la vista inicial. El <b>logo Guaita</b> obre el panell de navegació: alçats, planta, axonometria, enquadra, projecció, secció, estil (filferro, raigs X, estudi solar), disposició d\'1 a 4 vistes (planta, alçat sud i alçat est sincronitzats) i fons. Els eixos de referència X/Y/Z queden a la cantonada inferior.<h4>Fitxers grans</h4>La lectura i la triangulació es fan en segon pla (Web Worker) amb barra de progrés; el visor dibuixa el model en una sola malla i les taules només pinten les files visibles.<h4>Seleccionar i editar</h4>Fes clic al visor, a l\'arbre o a qualsevol fila de taula. Al panell de propietats pots canviar el tipus i la construcció de les superfícies, el nom i la zona dels espais, el nom de les zones, el tipus de finestra de les obertures i la U declarada de les construccions. Tot es pot desfer i es desa amb <b>Fitxer › Desa gbXML</b>.<h4>Analitzar</h4><b>Validació</b> revisa IDs, referències, planaritat, orientació de normals, adjacències, volums i coherència de U. <b>Envolupant</b> dona àrees per orientació, WWR, compacitat V/A i K. <b>CTE</b> compara amb els límits del DB-HE1 per zona climàtica. <b>Adjacències</b> mostra la matriu espai–espai. <b>Estudi solar</b> calcula la posició del sol i projecta ombres.<h4>Comparar</h4><b>Fitxer › Obre segon model</b> carrega B i llista espais, superfícies, obertures i construccions afegits, eliminats o canviats; el mode de color «Diferències» els marca al visor.<h4>Exportar</h4>gbXML editat, CSV i Excel de les taules, JSON de resum, OBJ/MTL i glTF de la geometria, PNG de la vista i informe HTML imprimible.',

 guide: '<h4>Open</h4>Drop a gbXML file on the viewer or use <b>File › Open</b>. Schema versions 0.37, 5.x and 6/7.x and lengths in metres, feet, millimetres, centimetres or inches are accepted (all converted to metres).<h4>Navigate</h4>Left button: orbit · right or middle: pan · wheel: zoom · double click: zoom to element. On mobile: one finger orbits, two fingers zoom and pan.<h4>Navigation, ViewCube and views</h4>The <b>ViewCube</b> (top right) shows the true orientation (north from <code>CADModelAzimuth</code>): click a face, edge or corner to go to that view, drag to orbit, <kbd>⌂</kbd> returns to the home view. The <b>Guaita logo</b> opens the navigation panel: elevations, plan, axonometric, fit, projection, section, style (wireframe, X-ray, solar study), 1 to 4 view layouts (plan, south and east elevations kept in sync) and background. The X/Y/Z reference axes stay in the lower corner.<h4>Large files</h4>Reading and triangulation run in the background (Web Worker) with a progress bar; the viewer draws the model as a single mesh and tables only paint visible rows.<h4>Select and edit</h4>Click in the viewer, the tree or any table row. In the properties panel you can change surface type and construction, space name and zone, zone name, opening window type and construction declared U. Every edit can be undone and is saved with <b>File › Save gbXML</b>.<h4>Analyse</h4><b>Validation</b> checks IDs, references, planarity, normal orientation, adjacencies, volumes and U consistency. <b>Envelope</b> gives areas by orientation, WWR, V/A compactness and K. <b>CTE</b> compares with DB-HE1 limits by climate zone. <b>Adjacency</b> shows the space–space matrix. <b>Solar study</b> computes sun position and casts shadows.<h4>Compare</h4><b>File › Open second model</b> loads B and lists added, removed or changed spaces, surfaces, openings and constructions; the «Differences» colour mode marks them in the viewer.<h4>Export</h4>Edited gbXML, CSV and Excel tables, JSON summary, OBJ/MTL and glTF geometry, PNG view and a printable HTML report.',

    fill.style[A] = v[0] * 100 + '%'; fill.style[S2] = (v[1] - v[0]) * 100 + '%';

  $('#st-file').innerHTML = m ? '<span class="acc">' + esc(S.file) + '</span>' + (S.dirty ? ' ●' : '') : '—';
  $('#st-ver').textContent = m ? 'gbXML ' + (m.version || '?') + ' · ' + m.lengthUnit : '';
  $('#st-cnt').textContent = m ? m.spaces.length + ' ' + t('tSpaces').toLowerCase() + ' · ' + m.surfaces.length + ' ' + t('tSurf').toLowerCase() + ' · ' + m.openings.length + ' ' + t('tOpen').toLowerCase() : '';
  const e = S.issues.filter(i => i.sev === 'error').length, w = S.issues.filter(i => i.sev === 'warn').length;
  const txt = m ? (e ? e + ' ✗ ' : '') + (w ? w + ' ⚠ ' : '') + (!e && !w ? '✓ ' + t('tVal') : '') : '';
  $('#st-val').textContent = txt;
  const vb = $('#tbVal'); if (vb) { vb.textContent = txt; vb.className = 'badge ' + (e ? 'e' : w ? 'w' : m ? 'ok' : ''); vb.style.display = m ? '' : 'none'; }
  document.title = (m ? S.file + (S.dirty ? ' ●' : '') + ' — ' : '') + 'guaitaGBXML ' + VERSION;
}

/* ================= wiring ================= */
function resizers() {
  const drag = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); const mv = ev => fn(ev); el.addEventListener('pointermove', mv); el.addEventListener('pointerup', () => { el.removeEventListener('pointermove', mv); resize(); }, { once: true }); });
  const root = document.documentElement.style;
  drag($('#rzl'), e => { root.setProperty('--lw', Math.max(140, Math.min(600, e.clientX)) + 'px'); resize(); });
  drag($('#rzr'), e => { root.setProperty('--rw', Math.max(180, Math.min(700, window.innerWidth - e.clientX)) + 'px'); resize(); });
  drag($('#rzb'), e => { const r = $('#main').getBoundingClientRect(); root.setProperty('--bh', Math.max(60, Math.min(r.height - 80, r.bottom - e.clientY)) + 'px'); resize(); });
}
function keys(e) {
  if (e.target.matches && e.target.matches('input,select,textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  const c = e.ctrlKey || e.metaKey, k = e.key;
  const act = (f) => { e.preventDefault(); f(); };
  if (c && k.toLowerCase() === 'o') return act(() => openFile());
  if (c && k.toLowerCase() === 's') return act(() => saveGb(e.shiftKey));
  if (c && k.toLowerCase() === 'z') return act(e.shiftKey ? redo : undo);
  if (c && k.toLowerCase() === 'y') return act(redo);
  if (c && k.toLowerCase() === 'f') return act(find);
  if (c) return;
  if (k === 'F1') return act(() => dlg(t('mGuide'), t('guide')));
  if (k === 'Escape') { if ($('#modal').style.display === 'flex') { $('#modal').style.display = 'none'; return; } closeMenus(); if (S.measure) toggleMeasure(false); else select(null); return; }
  if (!S.m) return;
  const map = { f: () => zoomTo(S.sel ? selEnts() : null), F: () => zoomTo(), Home: () => setView('iso'), v: () => toggleShow('cube'), '7': () => setView('top'), '1': () => setView('S'), '3': () => setView('E'), '0': () => setView('iso'), o: () => setOrtho(!S.ortho), i: () => isolate(), h: () => hideSel(), H: showAll, x: toggleXray, e: () => toggleShow('edges'), n: () => toggleShow('normals'), m: () => toggleMeasure() };
  if (map[k]) act(map[k]);
}
function init() {
  buildMenu(); buildToolbar(); applyI18nStatic(); setBg(S.bg); initViewer(); buildNav(); resizers();
  $('#navLogo').addEventListener('click', e => { e.stopPropagation(); if (!$('#navLogo').disabled) toggleNav(); });
  document.addEventListener('click', e => { closeMenus(); const p = $('#navCube'); if (p.classList.contains('show') && !e.target.closest('#navCol')) toggleNav(false); });
  document.addEventListener('keydown', keys);
  $('#treeq').addEventListener('input', () => renderTree());
  $('#fin').onchange = e => { const f = e.target.files[0]; if (f) readFile(f, false); };
  $('#fin2').onchange = e => { const f = e.target.files[0]; if (f) readFile(f, true); };
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => b.dataset.act === 'open' ? openFile() : loadText(GB.sampleGBXML(), 'exemple_guaitaGBXML.xml'));
  const view = $('#view');
  ['dragenter', 'dragover'].forEach(ev => view.addEventListener(ev, e => { e.preventDefault(); view.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(ev => view.addEventListener(ev, e => { e.preventDefault(); view.classList.remove('dragover'); }));
  view.addEventListener('drop', e => { const fs = e.dataTransfer.files; if (fs.length) readFile(fs[0], !!S.m && e.shiftKey); });
  window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('message', e => { const d = e.data; if (d && d.type === 'guaita-open' && typeof d.text === 'string') loadSource({ text: d.text }, d.name || 'model.xml'); });
  renderTree(); renderProps(); renderTab(); updStatus(); refreshMenus();
  if ('launchQueue' in window) window.launchQueue.setConsumer(async p => { if (p.files && p.files[0]) { const f = await p.files[0].getFile(); readFile(f, false, p.files[0]); } });
}
function applyI18nStatic() { document.querySelectorAll('[data-it]').forEach(e => e.title = t(e.dataset.it)); document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i)); document.querySelectorAll('[data-ip]').forEach(e => e.placeholder = t(e.dataset.ip)); document.documentElement.lang = LANG; }

window.GBAPP = { S, V, CUBE, loadText, loadB, loadSource, getXML, select, setColor, setLang, doEdit, undo, redo, exp, report, isolate, showAll, openTab, tabRows, t, I18N, menuDef, sectionPanel, sunPanel, viewPanel, toggleMeasure, allSheets, setView, goDir, setLayout, setBg, toggleNav, fixAllText, hit, zoomTo, fitView, trueDir, dirAngles };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
